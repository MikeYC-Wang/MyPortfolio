<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a07"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="milkTea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ccb2"/>
      <stop offset="100%" stop-color="#c8956d"/>
    </linearGradient>
    <linearGradient id="bigNum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe9c9"/>
      <stop offset="100%" stop-color="#a06b3f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(230,204,178,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- subtle scanlines -->
  <g opacity="0.04">
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#e6ccb2" stroke-width="1"/>
    <line x1="0" y1="430" x2="1200" y2="430" stroke="#e6ccb2" stroke-width="1"/>
  </g>

  <!-- decorative parallel agent paths (right side) -->
  <g transform="translate(820,90)" opacity="0.85">
    <!-- 4 parallel horizontal "lanes" with nodes -->
    <g stroke="url(#milkTea)" stroke-width="2" fill="none">
      <line x1="0" y1="40" x2="320" y2="40"/>
      <line x1="0" y1="120" x2="320" y2="120"/>
      <line x1="0" y1="200" x2="320" y2="200"/>
      <line x1="0" y1="280" x2="320" y2="280"/>
    </g>
    <!-- nodes -->
    <g fill="#e6ccb2">
      <circle cx="0" cy="40" r="6"/><circle cx="160" cy="40" r="6"/><circle cx="320" cy="40" r="6"/>
      <circle cx="0" cy="120" r="6"/><circle cx="160" cy="120" r="6"/><circle cx="320" cy="120" r="6"/>
      <circle cx="0" cy="200" r="6"/><circle cx="160" cy="200" r="6"/><circle cx="320" cy="200" r="6"/>
      <circle cx="0" cy="280" r="6"/><circle cx="160" cy="280" r="6"/><circle cx="320" cy="280" r="6"/>
    </g>
    <!-- labels -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#e6ccb2" opacity="0.7">
      <text x="-58" y="44">A &#x276F;</text>
      <text x="-58" y="124">B &#x276F;</text>
      <text x="-58" y="204">C &#x276F;</text>
      <text x="-58" y="284">D &#x276F;</text>
    </g>
    <text x="0" y="350" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#a06b3f" opacity="0.85">
      4 agents · parallel patches
    </text>
  </g>

  <!-- terminal prompt corner badge -->
  <g transform="translate(80,80)">
    <rect width="220" height="36" rx="6" fill="rgba(230,204,178,0.08)" stroke="rgba(230,204,178,0.25)" stroke-width="1"/>
    <circle cx="18" cy="18" r="5" fill="#ff6058"/>
    <circle cx="36" cy="18" r="5" fill="#ffbd2e"/>
    <circle cx="54" cy="18" r="5" fill="#27c93f"/>
    <text x="78" y="23" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#e6ccb2" opacity="0.85">
      ~/portfolio · main
    </text>
  </g>

  <!-- giant 16 -->
  <text x="80" y="350" font-family="Helvetica, Arial, sans-serif" font-size="240" font-weight="900"
        fill="url(#bigNum)" filter="url(#glow)" letter-spacing="-8">16</text>

  <!-- "vulnerabilities" tag next to 16 -->
  <g transform="translate(360,210)">
    <text font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#a06b3f">
      <tspan x="0" y="0">vulnerabilities.length</tspan>
    </text>
    <text font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e6ccb2" opacity="0.7">
      <tspan x="0" y="24">// 4 critical · 4 high · 8 medium</tspan>
    </text>
    <text font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#27c93f">
      <tspan x="0" y="46">&gt; status: all patched ✓</tspan>
    </text>
  </g>

  <!-- main title -->
  <text x="80" y="450" font-family="'PingFang TC','Helvetica Neue','Microsoft JhengHei',Arial,sans-serif"
        font-size="44" font-weight="800" fill="#ffffff" letter-spacing="1">
    我用 AI Agent 平行修補了
  </text>
  <text x="80" y="510" font-family="'PingFang TC','Helvetica Neue','Microsoft JhengHei',Arial,sans-serif"
        font-size="44" font-weight="800" fill="url(#milkTea)" letter-spacing="1">
    個人網站的 16 個資安問題
  </text>

  <!-- subtitle -->
  <text x="80" y="555" font-family="'PingFang TC','Helvetica Neue','Microsoft JhengHei',Arial,sans-serif"
        font-size="20" fill="#a08470" font-weight="500">
    一場原本只是「順便看看」的對話，最後變成把整個後端拆開重寫的故事
  </text>

  <!-- footer byline -->
  <g transform="translate(80,590)">
    <text font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#a06b3f">
      mike yc-wang  ·  portfolio security audit  ·  2026
    </text>
  </g>

  <!-- decorative shield/lock minimal icon top right -->
  <g transform="translate(1080,80)" opacity="0.85">
    <path d="M30 0 L60 12 L60 36 Q60 60 30 72 Q0 60 0 36 L0 12 Z"
          fill="none" stroke="url(#milkTea)" stroke-width="2.5"/>
    <rect x="20" y="28" width="20" height="18" rx="2" fill="none" stroke="#e6ccb2" stroke-width="2"/>
    <path d="M24 28 L24 22 Q24 16 30 16 Q36 16 36 22 L36 28" fill="none" stroke="#e6ccb2" stroke-width="2"/>
  </g>
</svg>
